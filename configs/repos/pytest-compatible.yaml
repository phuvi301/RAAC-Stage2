version: 2
repo: pytest-dev/pytest
base_image: python:3.8-slim-bookworm
system_packages:
- git
- gcc
- g++
environment:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONPATH: /workspace/src
test_framework: pytest
report_format: junit
report_path: /workspace/pytest.xml
install_commands:
- - python
  - -m
  - pip
  - install
  - --no-build-isolation
  - -e
  - .[testing]
test_command:
- python
- -m
- pytest
- testing
- -q
- --junitxml=/workspace/pytest.xml
