version: 2
repo: pallets/flask
base_image: python:3.10-slim-bookworm
system_packages:
- git
- gcc
- g++
environment:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
test_framework: pytest
report_format: junit
report_path: /workspace/pytest.xml
install_commands:
- - python
  - -m
  - pip
  - install
  - --no-build-isolation
  - -e
  - .
test_command:
- python
- -m
- pytest
- tests
- -q
- --junitxml=/workspace/pytest.xml
task_overrides: {}
dependency_commands:
- - python
  - -m
  - pip
  - install
  - pip==24.0
  - setuptools==68.2.2
  - wheel==0.41.3
- - python
  - -m
  - pip
  - install
  - pytest==7.4.4
  - pytest-cov==4.1.0
  - pytest-xdist==3.5.0
  - packaging==23.2
  - Werkzeug==2.2.3
  - Jinja2==3.1.2
  - itsdangerous==2.1.2
  - click==8.1.7
  - blinker==1.6.3
  - python-dotenv==1.0.0
  - asgiref==3.7.2
  - cryptography==41.0.7
