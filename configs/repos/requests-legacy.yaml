version: 2
repo: psf/requests
base_image: python:3.9-slim-bookworm
system_packages:
- git
- gcc
install_commands:
- - python
  - -m
  - pip
  - install
  - --no-deps
  - --no-build-isolation
  - -e
  - .
test_command:
- python
- -m
- pytest
- tests
- -q
- --junitxml=/workspace/pytest.xml
task_overrides:
  psf__requests-1051:
    test_command:
    - python
    - -m
    - pytest
    - test_requests.py
    - -q
    - --junitxml=/workspace/pytest.xml
    base_image: python:2.7.18-buster
    system_packages: []
    dependency_commands:
    - - python
      - -m
      - pip
      - install
      - pip==20.3.4
      - setuptools==44.1.1
      - wheel==0.37.1
    - - python
      - -m
      - pip
      - install
      - pytest==4.6.11
      - certifi==2021.10.8
    install_commands:
    - - python
      - -m
      - pip
      - install
      - --no-deps
      - --no-build-isolation
      - -e
      - .
  psf__requests-2930:
    network_fixture: requests_tarpit
    test_command:
    - python
    - -m
    - pytest
    - test_requests.py
    - -q
    - --junitxml=/workspace/pytest.xml
  psf__requests-5367:
    network_fixture: requests_tarpit
dependency_commands:
- - python
  - -m
  - pip
  - install
  - pip==24.0
  - setuptools==69.5.1
  - wheel==0.43.0
- - python
  - -m
  - pip
  - install
  - pytest==6.2.5
  - pytest-httpbin==1.0.0
  - pytest-mock==2.0.0
  - httpbin==0.7.0
  - Flask==1.1.4
  - Werkzeug==1.0.1
  - Jinja2==2.11.3
  - MarkupSafe==2.0.1
  - itsdangerous==1.1.0
  - trustme==0.9.0
  - urllib3==1.26.20
  - chardet==4.0.0
  - charset-normalizer==2.0.12
  - idna==2.10
  - certifi
  - PySocks==1.7.1
preflight_imports:
- requests
