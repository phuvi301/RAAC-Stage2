version: 2
repo: astropy/astropy
base_image: python:3.10-slim-bookworm
system_packages:
- git
- gcc
- g++
- gfortran
- libexpat1-dev
environment:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
test_framework: pytest
report_format: junit
report_path: /workspace/pytest.xml
install_commands:
- - python
  - -m
  - pip
  - install
  - --no-build-isolation
  - -e
  - .
test_command:
- python
- -m
- pytest
- astropy
- docs
- -q
- --junitxml=/workspace/pytest.xml
