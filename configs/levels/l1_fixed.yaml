version: l1-fixed-v3
level: L1
topology: fixed-workflow
# Labels of the fixed workflow; each runs a Registry role (Developer=Coder, Code Reviewer=Reviewer).
roles:
  - Requirement Analyst
  - Architect
  - Planner
  - Developer
  - Tester
  - Code Reviewer
# A round is one Developer patch; Tester/Code Reviewer feedback may loop back until this cap.
max_rounds: 3
hard_max_rounds: 3
