version: pre-executor-v1
# Số lần cho role chạy lại khi đầu ra sai schema hoặc luật kiểm bằng code.
max_flow_retries: 2
# Số vòng hỏi lại tối đa của flow clarify.
max_clarify_rounds: 5
# Model của từng role (id trong registry/roles/pre_executor/); để trống = model mặc định trong configs/llm.yaml.
# Cờ --model ghi đè tất cả. Ví dụ: "cc/claude-opus-5-5", "ds/deepseek-v4-pro".
models:
  clarifier: "cc/claude-opus-5-5"            # flow clarify
  business_analyst: "cc/claude-opus-5-5"     # flow spec
  tech_selector: "cc/claude-opus-5-5"        # flow tech_select
  system_architect: "cc/claude-opus-5-5"     # flow architecture
  environment_planner: "cc/claude-opus-5-5"  # flow environment
  task_decomposer: "cc/claude-opus-5-5"      # flow task_decomposer
