version: llm-v4
base_url: http://127.0.0.1:20128/v1
# Shared model for all roles using ref: default; CLI/LLM_MODEL can override it.
# Do not put API keys here.
model: "ds/deepseek-v4.1-flash"
temperature: 0.0
max_tokens: 100000
timeout_seconds: 400.0
max_retries: 2
backoff_seconds: 0.5
# Named profiles for role.model.ref; all use the shared endpoint/auth above.
# The reserved ref "default" uses top-level model/temperature/max_tokens.
profiles:
  environment:
    model: "ds/deepseek-v4.1-flash"
  analyst:
    model: "ds/deepseek-v4.1-flash"
  planner:
    model: "ds/deepseek-v4.1-flash"
  coder:
    model: "ds/deepseek-v4.1-flash"
  tester:
    model: "ds/deepseek-v4.1-flash"
  reviewer:
    model: "ds/deepseek-v4.1-flash"
