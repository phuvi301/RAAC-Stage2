[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raac-agent"
version = "0.1.0"
description = "Python and LangGraph agent collaboration benchmark"
requires-python = ">=3.11"
# Install requirements.lock before the editable project for reproducible development.
dependencies = ["langgraph", "langchain-core>=1.6,<2", "httpx>=0.27", "pydantic>=2", "PyYAML", "docker", "packaging"]

[project.scripts]
raac = "raac.cli:main"
raac-mas = "raac.mas_cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "radon", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.package-data]
"raac.common" = ["trace_assets/*.html", "trace_assets/*.css", "trace_assets/*.js", "trace_assets/*.mjs"]
