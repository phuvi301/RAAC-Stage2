tools:
- name: update_memory
  description: Replace active Coder working notes with conclusions, ruled-out hypotheses and next steps.
  read_only: false
- name: read_tool_result
  description: Read paged observed test/environment details from the same run without re-execution.
  read_only: true
- name: configure_environment
  description: Verify and select the local runtime/test configuration for development roles.
  read_only: false
- name: provision_environment
  description: Detect project requirements, compare with the machine and install what is missing.
  read_only: false
- name: list_files
  description: List repository paths.
  read_only: true
- name: read_file
  description: Read a repository file or range.
  read_only: true
- name: read_files
  description: Read multiple repository files or ranges.
  read_only: true
- name: search_repo
  description: Search repository text.
  read_only: true
- name: edit_file
  description: Create or update a permitted repository file.
  read_only: false
- name: replace_text
  description: Replace an exact region in a permitted file.
  read_only: false
- name: delete_file
  description: Delete a permitted repository file.
  read_only: false
- name: apply_patch
  description: Apply a multi-file Coder patch.
  read_only: false
- name: run_command
  description: Run one local argv command.
  read_only: false
- name: run_commands
  description: Run related local argv commands sequentially.
  read_only: false
- name: run_tests
  description: Run the selected local test suite and return observed results.
  read_only: false
